# This workflow is an example of how you can build and push this codebase to Quant Cloud.
# Use this as a starting point for your own workflow if you are forking this repository.
#
# Configuration Variables:
# - RUNNER_TYPE: Set to 'ubuntu-24.04-arm' for ARM runners, defaults to 'ubuntu-latest' (x86)
# - QUANT_BASE_URL: Set to 'https://dash.quantgov.cloud/api/v3' for QuantGov customers
#   (defaults to 'https://dashboard.quantcdn.io/api/v3')
name: Build and Push Node.js to Quant Cloud

on:
  push:
    branches:
      - develop
      - main
    tags:
      - '*'

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    if: github.repository_owner != 'quantcdn-templates'
    runs-on: ${{ vars.RUNNER_TYPE || 'ubuntu-latest' }}
    strategy:
      matrix:
        node_version: ['22', '24']
        include:
          - node_version: '22'
            is_default: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Initialize Quant Cloud
        uses: quantcdn/quant-cloud-init-action@v4
        id: init
        with:
          quant_organization: ${{ secrets.QUANT_ORGANIZATION }}
          quant_api_key: ${{ secrets.QUANT_API_KEY }}
          base_url: ${{ vars.QUANT_BASE_URL || 'https://dashboard.quantcdn.io/api/v3' }}

      - name: Select build platform
        id: build-platform
        env:
          BUILD_PLATFORM: ${{ fromJSON(vars.BUILD_PLATFORMS || '{}')[steps.init.outputs.environment_name] || vars.BUILD_PLATFORM || 'linux/amd64' }}
        run: echo "platform=$BUILD_PLATFORM" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: ${{ contains(steps.build-platform.outputs.platform, ',') || (runner.arch == 'X64' && steps.build-platform.outputs.platform != 'linux/amd64') || (runner.arch == 'ARM64' && steps.build-platform.outputs.platform != 'linux/arm64') }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Node.js image
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          platforms: ${{ steps.build-platform.outputs.platform }}
          push: true
          tags: |
            ${{ steps.init.outputs.stripped_endpoint }}/${{ secrets.QUANT_ORGANIZATION }}/${{ steps.init.outputs.quant_application }}:node-${{ matrix.node_version }}-${{ steps.init.outputs.image_suffix_clean }}
            ${{ matrix.is_default && format('{0}/{1}/{2}:node-{3}', steps.init.outputs.stripped_endpoint, secrets.QUANT_ORGANIZATION, steps.init.outputs.quant_application, steps.init.outputs.image_suffix_clean) || '' }}
          build-args: |
            NODE_VERSION=${{ matrix.node_version }}
          cache-from: type=gha,scope=node-${{ matrix.node_version }}
          cache-to: type=gha,mode=max,scope=node-${{ matrix.node_version }}

      - name: Create environment if it doesn't exist
        if: ${{ matrix.is_default && !startsWith(github.ref, 'refs/tags/') && steps.init.outputs.environment_exists == 'false' }}
        uses: quantcdn/quant-cloud-environment-action@v4
        with:
          api_key: ${{ secrets.QUANT_API_KEY }}
          organization: ${{ secrets.QUANT_ORGANIZATION }}
          app_name: ${{ steps.init.outputs.quant_application }}
          environment_name: ${{ steps.init.outputs.environment_name }}
          from_environment: production
          image_suffix: ${{ steps.init.outputs.image_suffix_clean }}
          base_url: ${{ vars.QUANT_BASE_URL || 'https://dashboard.quantcdn.io/api/v3' }}

      - name: Redeploy existing environment
        if: ${{ matrix.is_default && !startsWith(github.ref, 'refs/tags/') && steps.init.outputs.environment_exists == 'true' }}
        uses: quantcdn/quant-cloud-environment-state-action@v4
        with:
          api_key: ${{ secrets.QUANT_API_KEY }}
          organization: ${{ secrets.QUANT_ORGANIZATION }}
          application: ${{ steps.init.outputs.quant_application }}
          environment: ${{ steps.init.outputs.environment_name }}
          action: redeploy
          base_url: ${{ vars.QUANT_BASE_URL || 'https://dashboard.quantcdn.io/api/v3' }}
